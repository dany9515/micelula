<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd97a"/>
      <stop offset="50%" stop-color="#d4a44a"/>
      <stop offset="100%" stop-color="#a07020"/>
    </linearGradient>
    <radialGradient id="globeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3a5a8a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="200" height="200" rx="36" fill="#0d0a05"/>
  <rect x="3" y="3" width="194" height="194" rx="34" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Globo -->
  <circle cx="100" cy="100" r="60" fill="url(#globeGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <path d="M 60 90 Q 80 80, 100 90 T 140 95" fill="none" stroke="#7cba3f" stroke-width="2" opacity="0.7"/>
  <path d="M 70 110 Q 95 105, 120 115 T 145 120" fill="none" stroke="#7cba3f" stroke-width="2" opacity="0.7"/>
  <ellipse cx="100" cy="100" rx="60" ry="20" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="40" x2="100" y2="160" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>

  <!-- Águila -->
  <g fill="url(#goldGrad)" stroke="#a07020" stroke-width="0.5">
    <path d="M 100 70 L 50 50 L 30 60 L 45 75 L 60 70 L 75 80 L 95 80 Z"/>
    <path d="M 100 70 L 150 50 L 170 60 L 155 75 L 140 70 L 125 80 L 105 80 Z"/>
    <ellipse cx="100" cy="80" rx="10" ry="8" fill="#f5e8c8"/>
    <path d="M 100 85 L 95 92 L 105 92 Z" fill="#d4a44a"/>
    <path d="M 92 88 L 100 110 L 108 88 Z"/>
  </g>

  <!-- Llave -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" fill="url(#goldGrad)" stroke-linecap="round">
    <line x1="100" y1="115" x2="100" y2="155"/>
    <circle cx="100" cy="120" r="6" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="100" y1="145" x2="108" y2="145"/>
    <line x1="100" y1="150" x2="105" y2="150"/>
  </g>

  <!-- Banner -->
  <rect x="60" y="165" width="80" height="18" rx="2" fill="#1e3a5f" stroke="url(#goldGrad)" stroke-width="1"/>
  <text x="100" y="178" text-anchor="middle" font-family="serif" font-size="9" font-weight="700" fill="#ffd97a" letter-spacing="2">C.F.C.P.N.</text>
</svg>
